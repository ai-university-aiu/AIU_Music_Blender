<!-- The browser side of the localhost web face: the classic arc diagram and an
     infinite Web Audio walker that follows the beat graph exactly as jukebox.py does. -->
<!DOCTYPE html>
<html>
<head>
  <!-- Name the page. -->
  <title>AIU Music Blender</title>
  <!-- Style the page in the crimson-to-gold family palette. -->
  <style>
    /* Load the house font, Source Code Pro, from our own server (never from the network). */
    @font-face { font-family: "Source Code Pro"; font-weight: normal;
                 src: url("/static/fonts/SourceCodePro-Regular.ttf") format("truetype"); }
    /* Load the bold weight of the house font the same way. */
    @font-face { font-family: "Source Code Pro"; font-weight: bold;
                 src: url("/static/fonts/SourceCodePro-Bold.ttf") format("truetype"); }
    /* Paint the page dark crimson with warm gold text, all in the house font. */
    body { background: #3a0000; color: #ffce59;
           font-family: "Source Code Pro", monospace; text-align: center; }
    /* Give every control the house font too (buttons and inputs do not inherit it). */
    button, input, select, textarea { font-family: "Source Code Pro", monospace; }
    /* Style the headline. */
    h1 { color: #ff933a; margin-bottom: 0.2em; }
    /* Style each big rounded-corner group rectangle. */
    .group { margin: 1em auto; max-width: 640px; padding: 0.8em;
             border: 1px solid #c02b18; border-radius: 14px; }
    /* Style the title inside the top of each group rectangle. */
    .group h2 { margin: 0.1em 0 0.5em 0; color: #ff933a; font-size: 1.15em; }
    /* Dim disabled buttons so their state is visible at a glance. */
    button:disabled { opacity: 0.45; }
    /* The little spinning working indicator: a gold ring with one bright edge. */
    .spinner { display: inline-block; width: 0.85em; height: 0.85em;
               border: 2px solid rgba(255, 206, 89, 0.3); border-top-color: #ffce59;
               border-radius: 50%; vertical-align: -0.1em; margin-right: 0.45em;
               animation: spin 0.9s linear infinite; }
    /* Turn the ring around and around. */
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Style the info card row. */
    .cards { display: flex; justify-content: center; gap: 1em; margin: 0.8em; }
    /* Style each info card. */
    .card { background: #590000; border: 1px solid #c02b18; border-radius: 10px;
            padding: 0.6em 1.2em; min-width: 9em; display: none; }
    /* Style the small heading inside a card. */
    .card h3 { margin: 0 0 0.2em 0; color: #ff933a; font-size: 0.85em; }
    /* Style the big value inside a card. */
    .card p { margin: 0; color: #ffce59; font-size: 1.3em; }
    /* Give each control its own line, with the pieces of a row staying together. */
    .row { margin: 0.6em auto; display: flex; justify-content: center;
           align-items: center; gap: 0.5em; flex-wrap: wrap; }
    /* Style the buttons and inputs. */
    button, input { background: #7c0300; color: #ffce59; border: 1px solid #c02b18;
                    padding: 0.4em 0.8em; border-radius: 6px; }
    /* Style the status line. */
    #status { color: #f26d1f; min-height: 1.5em; }
  </style>
</head>
<body>
  <!-- Show the project name. -->
  <h1>AIU Music Blender</h1>
  <!-- Show the tagline. -->
  <p>The self-hosted infinite jukebox.</p>
  <!-- The first big rounded-corner group rectangle: the single-song infinite blender. -->
  <div class="group">
    <!-- The title inside the top of the rectangle. -->
    <h2>AIU Song Blender</h2>
    <!-- Row one: let the user paste a YouTube link, analyzed on Enter or button press. -->
    <div class="row">
      <label for="youtube_input">YouTube URL:</label>
      <input type="text" id="youtube_input" size="34"
             placeholder="https://www.youtube.com/watch?v=...">
      <button id="youtube_button">Fetch &amp; analyze</button>
    </div>
    <!-- Row two: let the user pick a local audio file instead. -->
    <div class="row">
      <input type="file" id="file_input" accept="audio/*">
    </div>
    <!-- Row three: the chaos label, slider, and live value, kept together on one line. -->
    <div class="row">
      <label for="chaos">Chaos (jump probability):</label>
      <input type="range" id="chaos" min="0" max="1" step="0.05" value="0.25"
             title="How likely each beat is to jump to a look-alike beat: 0.0 never, 1.0 always.">
      <span id="chaos_value">0.25</span>
    </div>
    <!-- Row four: start and stop the infinite walk. -->
    <div class="row">
      <button id="play_button" disabled>Play forever</button>
      <button id="stop_button" disabled>Stopped</button>
    </div>
    <!-- Show what the local pipeline found, one card per fact, inside the same rectangle. -->
    <div class="cards">
      <!-- The tempo info card. -->
      <div class="card" id="tempo_card"><h3>Tempo</h3><p id="tempo_value"></p></div>
      <!-- The key info card. -->
      <div class="card" id="key_card"><h3>Key</h3><p id="key_value"></p></div>
    </div>
    <!-- Report progress, beats, and edges here, inside the same rectangle. -->
    <div id="status">Choose a song to analyze it locally.</div>
  </div>

  <!-- The second big rounded-corner group rectangle: the two-song mash-up blender. -->
  <div class="group">
    <!-- The title inside the top of the rectangle. -->
    <h2>AIU Mash-Up Blender</h2>
    <!-- Row one: the first song's YouTube link and its independent vocal choice. -->
    <div class="row">
      <label for="song_one_input">SONG-1 YouTube URL:</label>
      <input type="text" id="song_one_input" size="30"
             placeholder="https://www.youtube.com/watch?v=...">
      <label title="Include SONG-1's vocals in the blend.">
        <input type="checkbox" id="vocals_one" checked> vocals</label>
    </div>
    <!-- Row two: the second song's YouTube link and its independent vocal choice. -->
    <div class="row">
      <label for="song_two_input">SONG-2 YouTube URL:</label>
      <input type="text" id="song_two_input" size="30"
             placeholder="https://www.youtube.com/watch?v=...">
      <label title="Include SONG-2's vocals in the blend.">
        <input type="checkbox" id="vocals_two"> vocals</label>
    </div>
    <!-- Row three: blend the two songs into one mash-up. -->
    <div class="row">
      <button id="blend_button">Blend the two songs</button>
    </div>
    <!-- Report mash-up progress and the honest compatibility report here. -->
    <div id="mashup_status">Paste two songs, then blend; the result loads into the
      AIU Song Blender above so it can play forever.</div>
  </div>
  <!-- Draw the classic arc diagram on this canvas. -->
  <canvas id="arc_canvas" width="900" height="520"></canvas>

  <script>
    // Hold the current analysis record.
    let record = null;
    // Hold the decoded audio buffer.
    let audioBuffer = null;
    // Hold the Web Audio context.
    let audioContext = null;
    // Hold the walker's state: the current beat and the stop flag.
    let currentBeat = 0, walking = false, nextTimer = null;
    // Find the page elements once.
    const fileInput = document.getElementById("file_input");
    const chaosSlider = document.getElementById("chaos");
    // Find the label that shows the slider's current value.
    const chaosValue = document.getElementById("chaos_value");
    // Whenever the slider moves, show its current value beside it.
    chaosSlider.addEventListener("input", () => {
      // Write the slider's value, always with two decimals, into the value label.
      chaosValue.textContent = parseFloat(chaosSlider.value).toFixed(2);
    });
    const playButton = document.getElementById("play_button");
    const stopButton = document.getElementById("stop_button");
    const statusLine = document.getElementById("status");
    const canvas = document.getElementById("arc_canvas");
    const paint = canvas.getContext("2d");

    // Find the new page elements: the YouTube row and the info cards.
    const youtubeInput = document.getElementById("youtube_input");
    const youtubeButton = document.getElementById("youtube_button");
    const tempoCard = document.getElementById("tempo_card");
    const tempoValue = document.getElementById("tempo_value");
    const keyCard = document.getElementById("key_card");
    const keyValue = document.getElementById("key_value");

    // Find the mash-up rectangle's elements.
    const songOneInput = document.getElementById("song_one_input");
    const songTwoInput = document.getElementById("song_two_input");
    const vocalsOne = document.getElementById("vocals_one");
    const vocalsTwo = document.getElementById("vocals_two");
    const blendButton = document.getElementById("blend_button");
    const mashupStatus = document.getElementById("mashup_status");

    // Finish any analysis: unwrap the server's answer and load the record.
    async function finishAnalysis(answer) {
      // Refuse gracefully if the server reported a problem.
      if (!answer.ok) { statusLine.textContent = "Analysis failed - check the input."; return; }
      // Load the record the server returned.
      await loadRecord(await answer.json());
    }

    // Load one analysis record: keep it, decode its audio, fill the cards, draw the arcs.
    async function loadRecord(newRecord) {
      // Keep the analysis record.
      record = newRecord;
      // Fetch the audio bytes back from the server.
      const audioBytes = await (await fetch("/audio/" + record.audio_key)).arrayBuffer();
      // Create the audio context on first use.
      audioContext = audioContext || new AudioContext();
      // Decode the audio for beat-accurate playback.
      audioBuffer = await audioContext.decodeAudioData(audioBytes);
      // Fill and show the tempo card.
      tempoValue.textContent = record.tempo.toFixed(1) + " BPM";
      tempoCard.style.display = "block";
      // Fill and show the key card.
      keyValue.textContent = record.key.tonic + " " + record.key.mode
        + " (" + record.key.camelot + ")";
      keyCard.style.display = "block";
      // Report the rest on the status line.
      statusLine.textContent = record.beats.length + " beats, "
        + record.graph.flat().length + " jump edges. Ready.";
      // Draw the arc diagram.
      drawArcs(-1);
      // Enable the play button.
      playButton.disabled = false;
    }

    // When a file is chosen, send it to the local server for analysis.
    fileInput.addEventListener("change", async () => {
      // Take the chosen file.
      const file = fileInput.files[0];
      // Do nothing if the chooser was cancelled.
      if (!file) return;
      // Tell the user analysis is running.
      statusLine.textContent = "Analyzing locally (first time can take a minute)...";
      // Build the upload form.
      const form = new FormData();
      // Attach the file.
      form.append("file", file);
      // Post the file to the analyze route and finish.
      finishAnalysis(await fetch("/analyze", { method: "POST", body: form }));
    });

    // Send a pasted YouTube link to the local server for download and analysis.
    async function analyzeYoutube() {
      // Take the pasted link.
      const link = youtubeInput.value.trim();
      // Do nothing when the box is empty.
      if (!link) return;
      // Show the work on the button itself so pressing it visibly does something.
      youtubeButton.disabled = true;
      // Change the button label to the state, with the little spinning working indicator.
      youtubeButton.innerHTML = '<span class="spinner"></span>Fetching...';
      // Tell the user the download and analysis are running (this can take a minute).
      statusLine.textContent = "Downloading locally, then analyzing (can take a minute)...";
      // Guard the whole round trip so every failure is shown, never silent.
      try {
        // Build the form carrying the link.
        const form = new FormData();
        // Attach the link as the input.
        form.append("input", link);
        // Post the link to the analyze route and finish.
        await finishAnalysis(await fetch("/analyze", { method: "POST", body: form }));
      // Surface any network or server failure on the status line.
      } catch (problem) {
        // Show the failure instead of doing nothing.
        statusLine.textContent = "Could not reach the local server: " + problem
          + " - is 'bin/aiu-music-blender web' running?";
      // Always restore the button, success or failure.
      } finally {
        // Re-enable the button.
        youtubeButton.disabled = false;
        // Restore the button label.
        youtubeButton.textContent = "Fetch & analyze";
      }
    }
    // Blend the two pasted songs into a mash-up, then load it into the Song Blender above.
    async function blendSongs() {
      // Take both pasted links.
      const linkOne = songOneInput.value.trim();
      // Take the second link.
      const linkTwo = songTwoInput.value.trim();
      // Ask for both songs when either box is empty.
      if (!linkOne || !linkTwo) {
        // Explain what is needed.
        mashupStatus.textContent = "Paste BOTH song links first.";
        // Stop here.
        return;
      }
      // Show the work on the button itself.
      blendButton.disabled = true;
      // Change the button label to the state, with the little spinning working indicator.
      blendButton.innerHTML = '<span class="spinner"></span>Blending...';
      // Say which vocals will be in the blend, and warn about the slow parts.
      mashupStatus.textContent = "Downloading, matching tempo and key"
        + ((vocalsOne.checked && vocalsTwo.checked) ? ""
           : ", separating stems (adds a few minutes)")
        + ", blending...";
      // Guard the whole round trip so every failure is shown, never silent.
      try {
        // Build the form carrying both links.
        const form = new FormData();
        // Attach the first song.
        form.append("input_a", linkOne);
        // Attach the second song.
        form.append("input_b", linkTwo);
        // Attach SONG-1's independent vocal choice.
        if (vocalsOne.checked) form.append("vocals_a", "on");
        // Attach SONG-2's independent vocal choice.
        if (vocalsTwo.checked) form.append("vocals_b", "on");
        // Post both songs to the mashup route.
        const answer = await fetch("/mashup", { method: "POST", body: form });
        // Refuse gracefully if the server reported a problem.
        if (!answer.ok) { mashupStatus.textContent = "Blend failed - check both links."; return; }
        // Unwrap the report and the playable record.
        const blended = await answer.json();
        // Load the mash-up into the Song Blender above, ready to play forever.
        await loadRecord(blended.record);
        // Show the honest compatibility report.
        mashupStatus.textContent = "Blended! Compatibility "
          + blended.report.compatibility.score.toFixed(3)
          + " (stretch " + (blended.report.compatibility.stretch * 100).toFixed(1)
          + "%, key shift " + blended.report.key_shift_applied
          + "). Vocals: SONG-1 " + (blended.report.vocals_a ? "on" : "off")
          + ", SONG-2 " + (blended.report.vocals_b ? "on" : "off")
          + ". Loaded into the AIU Song Blender above - press Play forever.";
      // Surface any network or server failure.
      } catch (problem) {
        // Show the failure instead of doing nothing.
        mashupStatus.textContent = "Could not reach the local server: " + problem;
      // Always restore the button, success or failure.
      } finally {
        // Re-enable the button.
        blendButton.disabled = false;
        // Restore the button label.
        blendButton.textContent = "Blend the two songs";
      }
    }
    // Blend when the button is pressed.
    blendButton.addEventListener("click", blendSongs);

    // If this page was opened as a plain file, there is no server behind it; say so plainly.
    if (window.location.protocol === "file:") {
      // Explain the situation and the remedy on the status line.
      statusLine.textContent = "This page was opened as a file, so no engine is behind it. "
        + "Run 'bin/aiu-music-blender web' in a terminal, then open http://localhost:8765";
    }

    // Analyze the link when the button is pressed.
    youtubeButton.addEventListener("click", analyzeYoutube);
    // Analyze the link when Enter is pressed in the box.
    youtubeInput.addEventListener("keydown", (key) => {
      // React only to the Enter key.
      if (key.key === "Enter") analyzeYoutube();
    });

    // Compute a beat's position on the diagram's baseline.
    function beatPosition(beatIndex) {
      // Spread the beats along a horizontal baseline.
      return 40 + (canvas.width - 80) * beatIndex / (record.beats.length - 1);
    }

    // Draw the classic arc diagram, highlighting the active beat's edges.
    function drawArcs(activeBeat) {
      // Clear the canvas.
      paint.clearRect(0, 0, canvas.width, canvas.height);
      // Choose the baseline height.
      const baseline = canvas.height - 40;
      // Draw the baseline.
      paint.strokeStyle = "#c02b18";
      paint.beginPath();
      paint.moveTo(40, baseline);
      paint.lineTo(canvas.width - 40, baseline);
      paint.stroke();
      // Draw every jump edge as an arc over the baseline.
      for (let beat = 0; beat < record.graph.length; beat++) {
        // Walk this beat's edges.
        for (const [target, distance] of record.graph[beat]) {
          // Highlight the active beat's edges in gold; others glow ember.
          paint.strokeStyle = (beat === activeBeat) ? "#ffce59" : "rgba(240,109,31,0.25)";
          // Find both ends on the baseline.
          const from = beatPosition(beat), to = beatPosition(target);
          // Make the arc height follow the jump span.
          const height = Math.min(baseline - 20, Math.abs(to - from) * 0.5);
          // Draw the arc as a curve.
          paint.beginPath();
          paint.moveTo(from, baseline);
          paint.quadraticCurveTo((from + to) / 2, baseline - height, to, baseline);
          paint.stroke();
        }
      }
      // Draw the active beat marker.
      if (activeBeat >= 0) {
        // Paint the marker gold.
        paint.fillStyle = "#ffce59";
        // Draw the marker dot.
        paint.beginPath();
        paint.arc(beatPosition(activeBeat), baseline, 6, 0, 2 * Math.PI);
        paint.fill();
      }
    }

    // Return the end time of a beat (the next beat's start, or the song's end).
    function beatEnd(beatIndex) {
      // Use the next beat's start when there is one.
      return (beatIndex + 1 < record.beats.length) ? record.beats[beatIndex + 1] : record.duration;
    }

    // Choose the next beat exactly as the engine's walker does.
    function chooseNextBeat(beatIndex) {
      // Look up this beat's jump edges.
      const edges = record.graph[beatIndex];
      // At the final beat, jump back into the song so it never ends.
      if (beatIndex >= record.beats.length - 1)
        return edges.length ? edges[0][0] : Math.floor(record.beats.length / 2);
      // With probability chaos, take a similarity-weighted jump edge.
      if (edges.length && Math.random() < parseFloat(chaosSlider.value)) {
        // Turn distances into weights favoring similar targets.
        const weights = edges.map(([, d]) => 1 / (0.001 + d));
        // Sum the weights for the draw.
        const total = weights.reduce((a, b) => a + b, 0);
        // Draw a point in the weight range.
        let draw = Math.random() * total;
        // Walk the edges until the draw is spent.
        for (let i = 0; i < edges.length; i++) { draw -= weights[i]; if (draw <= 0) return edges[i][0]; }
      }
      // Otherwise simply advance to the next beat.
      return beatIndex + 1;
    }

    // The scheduler state: the beat to schedule next, when it starts on the audio clock,
    // the queued sources (so Stop can silence them), and the pump timer.
    let scheduleBeat = 0, scheduleTime = 0, queuedSources = [], pumpTimer = null;
    // How far ahead, in seconds, beats are queued on the audio clock.
    const LOOKAHEAD_SECONDS = 0.35;

    // Queue one beat span at an exact time on the audio clock (sample-accurate, no drift).
    function queueBeat(beatIndex, startTime) {
      // Create a source for this beat span.
      const source = audioContext.createBufferSource();
      // Give the source the song's audio.
      source.buffer = audioBuffer;
      // Connect the source to the speakers.
      source.connect(audioContext.destination);
      // Compute this beat's start and length inside the song.
      const start = record.beats[beatIndex], length = beatEnd(beatIndex) - start;
      // Start exactly on the audio clock, playing exactly this beat span.
      source.start(startTime, start, length);
      // Remember the source so Stop can silence it.
      queuedSources.push(source);
      // Light up the diagram when this beat actually begins.
      setTimeout(() => { if (walking) drawArcs(beatIndex); },
                 Math.max(0, (startTime - audioContext.currentTime) * 1000));
      // Report how long this beat lasts.
      return length;
    }

    // The pump: keep the audio clock's queue topped up a little way into the future.
    function pumpSchedule() {
      // Stop pumping if the user pressed stop.
      if (!walking) return;
      // Queue beats until the lookahead horizon is full.
      while (scheduleTime < audioContext.currentTime + LOOKAHEAD_SECONDS) {
        // Queue the current beat at its exact start time and learn its length.
        const length = queueBeat(scheduleBeat, scheduleTime);
        // The next beat starts exactly when this one ends.
        scheduleTime += length;
        // Choose the next beat with the engine's rules (reading the chaos slider live).
        scheduleBeat = chooseNextBeat(scheduleBeat);
        // Forget sources that have already finished playing.
        if (queuedSources.length > 8) queuedSources.shift();
      }
    }

    // Start the infinite walk when play is pressed.
    playButton.addEventListener("click", () => {
      // Mark the walk as running.
      walking = true;
      // Swap the button states, with the labels saying what is happening.
      playButton.disabled = true; playButton.textContent = "Playing forever...";
      stopButton.disabled = false; stopButton.textContent = "Stop";
      // Begin at beat zero, a breath from now on the audio clock.
      scheduleBeat = 0;
      // Anchor the schedule to the audio clock.
      scheduleTime = audioContext.currentTime + 0.06;
      // Fill the queue immediately.
      pumpSchedule();
      // Keep the queue topped up ten times a second.
      pumpTimer = setInterval(pumpSchedule, 100);
    });

    // Stop the walk when stop is pressed.
    stopButton.addEventListener("click", () => {
      // Mark the walk as stopped.
      walking = false;
      // Stop the pump.
      clearInterval(pumpTimer);
      // Silence every queued source.
      queuedSources.forEach((source) => { try { source.stop(); } catch (ignored) {} });
      // Forget the silenced sources.
      queuedSources = [];
      // Swap the button states back, with the labels saying what is happening.
      playButton.disabled = false; playButton.textContent = "Play forever";
      stopButton.disabled = true; stopButton.textContent = "Stopped";
    });
  </script>
</body>
</html>
